<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Développeur logiciel : un métier de création</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>/*__REVEAL_CSS__*/</style>
<style>/*__THEME_CSS__*/</style>
<style>
:root{
  --ink:#17162B; --paper:#FFFFFF; --indigo:#3A2BE0; --tangerine:#FF7A1A;
  --lime:#C5F23C; --bubblegum:#FF5CA8; --sky:#39C0F5; --mist:#EEF0FA;
  --r-background-color:var(--paper); --r-main-color:var(--ink); --r-heading-color:var(--ink);
  --r-main-font:"Nunito","Avenir Next Rounded","Segoe UI",system-ui,sans-serif;
  --r-heading-font:"Fredoka","Arial Rounded MT Bold","Nunito",system-ui,sans-serif;
  --r-main-font-size:34px; --r-heading-text-transform:none; --r-heading-font-weight:700;
  --r-heading1-size:2.1em; --r-link-color:var(--indigo);
}
.reveal{font-weight:500}
.reveal .slides section{text-align:left;padding:0 20px;box-sizing:border-box}
.reveal .slides section *{box-sizing:border-box}
.reveal h1{letter-spacing:-.01em;line-height:1.05;margin:0 0 .5em}
.reveal ul{margin:.2em 0 0 .9em;line-height:1.35}
.reveal li{margin:.35em 0}
.reveal li::marker{color:var(--tangerine)}
.reveal p{margin:.6em 0}
.reveal .controls{color:var(--indigo)}
.reveal .progress{height:6px;color:var(--tangerine)}

/* Title & section slides */
.reveal section.title, .reveal section.section{color:#fff}
.reveal section.title h1, .reveal section.section h1{color:#fff;font-size:2.4em;max-width:16ch}
.reveal section.title .who{font-size:.8em;opacity:.9}
.reveal section.section .part{font-family:var(--r-heading-font);font-size:1em;margin:0 0 .3em;
  background:#fff;color:var(--ink);display:inline-block;padding:.1em .6em;border-radius:999px;transform:rotate(-2deg)}

/* Era sticker */
.reveal section[data-year]{padding-top:0.3em;min-height:9em}
.reveal section[data-year]::before{content:attr(data-year);position:absolute;right:-10px;top:-10px;
  font-family:var(--r-heading-font);font-weight:700;font-size:3.6em;line-height:1;color:#fff;
  background:var(--tangerine);padding:.25em .4em;border-radius:.3em;transform:rotate(6deg);
  box-shadow:6px 6px 0 var(--ink)}
.reveal section[data-year="1985"]::before{background:var(--sky)}
.reveal section[data-year="1998"]::before{background:var(--lime);color:var(--ink)}
.reveal section[data-year="2010"]::before{background:var(--bubblegum)}
.reveal section[data-year="2023"]::before{background:var(--indigo)}
.reveal section[data-year] h1{max-width:14ch}

/* App chips */
.apps{display:flex;flex-wrap:wrap;align-items:center;gap:.4em;margin:.4em 0}
.apps:last-of-type{margin-bottom:.8em}
.apps-lbl{width:7.5em;font-weight:700;font-size:.75em;color:#4a4870}
.chip{font-family:var(--r-heading-font);font-weight:600;padding:.2em .7em;border-radius:999px;background:var(--mist);border:3px solid var(--ink)}
.chip:nth-child(3n){background:var(--lime)}
.chip:nth-child(3n+1){background:#FFD1E8}
.chip:nth-child(3n+2){background:#D5F0FF}

/* Paths */
.path{display:flex;align-items:stretch;gap:.4em;margin:.4em 0}
.path .step{flex:1;background:var(--mist);border-radius:.6em;padding:.6em .8em;font-size:.72em;display:flex;flex-direction:column;gap:.3em}
.path .step b{font-family:var(--r-heading-font);font-size:1.4em;color:var(--indigo)}
.path .step:first-child{background:var(--lime)}
.path .arrow{width:.9em;align-self:center;height:.9em;border-top:5px solid var(--ink);border-right:5px solid var(--ink);transform:rotate(45deg);flex:none}
.aside{font-size:.75em;font-style:italic;color:#4a4870}

.trio{display:flex;gap:.6em;margin-top:.6em}
.trio>div{flex:1;border:4px solid var(--ink);border-radius:.8em;padding:.7em .8em;display:flex;flex-direction:column;gap:.3em;font-size:.8em}
.trio b{font-family:var(--r-heading-font);font-size:1.4em}
.trio.me{margin-top:1em} .trio.me>div{font-size:.75em;line-height:1.3} .trio.me b{font-size:2em;line-height:1}
.trio>div:nth-child(1){background:var(--lime)} .trio>div:nth-child(2){background:#D5F0FF} .trio>div:nth-child(3){background:#FFD1E8}

.oops .bad,.oops .good{font-family:var(--r-heading-font);font-weight:600;display:inline-block;padding:.2em .7em;border-radius:.4em;font-size:.9em}
.oops .bad{background:var(--bubblegum);color:#fff}
.oops .good{background:var(--lime);margin-top:.6em}
.oops ul{font-size:.9em}

/* Part 2 : personas */
.team{display:flex;justify-content:space-between;gap:.4em;margin:.5em 0 .7em}
.persona{flex:1;text-align:center;font-size:.6em;line-height:1.15}
.persona .face{width:2.6em;height:2.6em;margin:0 auto .25em;border-radius:50%;border:4px solid var(--ink);display:grid;place-items:center;font-size:1.8em}
.persona b{display:block;font-family:var(--r-heading-font);font-size:1.25em;margin-bottom:.15em}
.c1 .face{background:var(--tangerine)} .c2 .face{background:var(--sky)} .c3 .face{background:var(--lime)} .c4 .face{background:var(--bubblegum)} .c5 .face{background:#FFD84D}
.project{border:4px dashed var(--indigo);border-radius:.8em;padding:.5em .9em;font-size:.8em;background:var(--mist)}
.project b{font-family:var(--r-heading-font);color:var(--indigo)}

/* Part 2 : planning */
.plan{display:grid;grid-template-columns:1fr 1.2fr;gap:.8em;align-items:start;margin-top:.3em}
.plan h3{font-size:.85em;margin:0 0 .3em;color:var(--indigo);text-transform:none}
.cloud{display:flex;flex-wrap:wrap;gap:.35em}
.cloud span{font-size:.62em;padding:.25em .7em;border-radius:999px;border:3px solid var(--ink);background:#fff;font-weight:700}
.cloud span.hot{background:var(--bubblegum);color:#fff;transform:rotate(-3deg)}
.cloud span.pick{background:var(--lime)}
.plan svg{width:100%;height:auto;display:block}
.plan .cap{font-size:.6em;color:#4a4870;margin-top:.3em}

/* Part 2 : waterfall */
.falls{position:relative;width:100%;height:17em;font-size:.62em;margin-top:.5em}
.falls .stage{position:absolute;width:18.5%;border:4px solid var(--ink);border-radius:.6em;padding:.45em .5em;background:#fff;line-height:1.15}
.falls .stage b{display:block;font-family:var(--r-heading-font);font-size:1.3em;margin-bottom:.2em}
.falls .stage .by{display:flex;gap:.25em;flex-wrap:wrap}
.falls .by span{border-radius:999px;padding:.05em .5em;font-weight:700;font-size:.9em;border:2px solid var(--ink)}
.by .p1{background:var(--tangerine);color:#fff} .by .p2{background:var(--sky)} .by .p3{background:var(--lime)} .by .p4{background:var(--bubblegum);color:#fff} .by .p5{background:#FFD84D}
.falls .s1{left:0;top:0} .falls .s2{left:20.4%;top:2.9em} .falls .s3{left:40.8%;top:5.8em;background:var(--mist)} .falls .s4{left:61.2%;top:8.7em;background:var(--mist)} .falls .s5{left:81.5%;top:11.6em;background:var(--mist)}
.falls .flow{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}

/* Part 3 : cégep & universités */
.decs,.unis{display:grid;grid-template-columns:1fr 1fr;gap:.7em;margin-top:.2em}
.dec,.uni{position:relative;border:4px solid var(--ink);border-radius:.8em;padding:.55em .8em .6em;font-size:.6em;line-height:1.2;display:flex;flex-direction:column;gap:.25em}
.dec b,.uni b{font-family:var(--r-heading-font);font-size:1.55em;line-height:1.05}
.dec .prog,.uni .prog{font-weight:700;color:#4a4870}
.dec .len,.uni .len{position:absolute;top:-.8em;right:.8em;font-family:var(--r-heading-font);font-weight:700;background:var(--ink);color:#fff;padding:.1em .6em;border-radius:999px;transform:rotate(3deg)}
.dec.tech{background:#D5F0FF} .dec.pre{background:#FFE6D1}
.dec .where{display:flex;flex-wrap:wrap;gap:.3em;margin:.2em 0}
.dec .where span{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:.05em .55em;font-weight:700;font-size:.9em}
.dec .lbl,.uni .lbl{margin:.3em 0 0;font-weight:700;color:var(--indigo)}
.reveal .dec ul,.reveal .uni ul{margin:0 0 0 1.1em;line-height:1.2}
.reveal .dec li,.reveal .uni li{margin:.12em 0}
.dec .out{margin:.2em 0 0;font-family:var(--r-heading-font);font-weight:600}
.uni{background:#fff}
.uni.u1{background:#FFE6D1} .uni.u2{background:#D5F0FF} .uni.u3{background:#FFD1E8} .uni.u4{background:#ECFBC4}
.uni .perk{align-self:flex-start;margin-top:.35em;background:var(--lime);border:2px solid var(--ink);border-radius:.4em;padding:.1em .5em;font-weight:700}
.uni.u4 .perk{background:#fff}
.reveal .tip{font-size:.62em;margin-top:.7em;background:var(--mist);border-radius:.5em;padding:.35em .7em}

/* Photos */
.photos{display:flex;gap:.8em;align-items:flex-start;margin-top:.4em}
.photos figure{margin:0;width:min-content}
.reveal .photos img{display:block;height:6.6em;width:auto;max-width:none;max-height:none;margin:0;border:4px solid var(--ink);border-radius:.4em}
.photos figcaption{font-size:.5em;margin-top:.3em;color:#4a4870;font-weight:700;line-height:1.2}
.win{border:4px solid var(--ink);border-radius:.4em;overflow:hidden;background:#fff}
.win .bar{display:flex;align-items:center;gap:.3em;background:#C9CBD6;border-bottom:3px solid var(--ink);padding:.25em .5em;font-size:.4em;font-weight:700}
.win .bar i{flex:none;width:.9em;height:.9em;border-radius:50%;border:2px solid var(--ink);background:var(--tangerine)}
.win .bar i:nth-child(2){background:#FFD84D} .win .bar i:nth-child(3){background:var(--lime)}
.win .url{flex:1;margin-left:.3em;background:#fff;border:2px solid var(--ink);border-radius:.3em;padding:0 .5em;font-family:ui-monospace,Menlo,monospace;white-space:nowrap;overflow:hidden}
.reveal .photos .win img{width:100%;height:auto;border:0;border-radius:0}
.reveal .win pre.code{margin:0;width:auto;box-shadow:none;padding:.6em .8em;font-size:.36em;line-height:1.4;background:var(--ink);color:var(--mist);font-family:ui-monospace,Menlo,monospace;white-space:pre;overflow:hidden}
.code .t{color:var(--sky)} .code .a{color:var(--lime)} .code .s{color:#FFB37A}
.reveal .photos + .attrib{position:static;margin:.5em 0 0}
.reveal section.with-photos ul{font-size:.85em}
.reveal section.with-photos h1{margin-bottom:.3em}

.reveal .attrib{position:absolute;bottom:.4em;right:1em;font-size:.4em;color:#4a4870}
@media (prefers-reduced-motion:reduce){.reveal .slides section{transition:none}}
</style>
</head>
<body>
<div class="reveal">
<div class="slides">

<section data-markdown data-separator="^\n---\n" data-separator-notes="^Note:">
<script type="text/template">
/*__MD__*/
</script>
</section>

</div>
</div>
<script>/*__REVEAL_JS__*/</script>
<script>/*__MARKDOWN_JS__*/</script>
<script>/*__NOTES_JS__*/</script>
<script>
Reveal.initialize({
  hash:true, slideNumber:'c/t', transition:'slide', backgroundTransition:'fade',
  width:1280, height:720, margin:0.06,
  plugins:[RevealMarkdown, RevealNotes]
});
</script>
</body>
</html>
